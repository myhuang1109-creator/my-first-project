可以直接複製以下修改後的完整 Prompt 貼給 Gemini / Canvas，已經幫你補上「短句挖空填充」、「主詞／動詞顏色區分鷹架」以及「語音慢速調整」的結構化需求：

```markdown
請扮演一位資深前端工程師與國中英語特教教材專家。
請使用 HTML + Tailwind CSS + JavaScript（寫在單一 HTML 檔案內），幫我製作一個「國中英語特教有聲單字與短句學習網頁」。

網頁需具備以下重點功能與介面要求：

1. 單字與句型資料輸入介面：
   - 頁面頂部提供一個文字輸入框（<textarea>）與「載入資料」按鈕。
   - 支援使用者輸入 JSON 格式，或直接貼上單字清單。系統自動動態解析載入。

2. 結構化資料與視覺鷹架設計 (UI/UX)：
   - 單字卡與例句展示區：
     * 主詞與動詞顏色區分：例句中必須自動將「主詞 (Subject)」標示為淡藍色底色與藍字（如 `bg-blue-100 text-blue-800`），「動詞 (Verb)」標示為淡紅色底色與紅字（如 `bg-rose-100 text-rose-800`），協助學生辨識句型結構。
     * 提供「提示」按鈕，點擊後展開中文翻譯與諧音記憶小技巧。
   - 低彩度柔和色調、大字體、圓角大按鈕，減少認知負荷。

3. 短句聽力挖空填充測驗 (Fill-in-the-Blank)：
   - 根據每個單字/例句生成一題「短句聽力挖空填充」。
   - 將例句中的目標單字挖空（以底線 `___` 表示）。
   - 提供「播放句子語音」按鈕與選項/輸入框，學生聽完朗讀後填入正確單字。

4. 語音朗讀與音速調整 (Web Speech API)：
   - 採用 `window.speechSynthesis` 朗讀。
   - 句子完整朗讀語速設定為 0.65x（慢速特教模式），避免連讀過快。
   - 單字與音節拆解朗讀語速設定為 0.5x，讓學生能聽清每個音節發音。

5. 預設資料：
   - 預設載入包含「主詞 S、動詞 V 標註」與「挖空測驗」的 3 組範例 JSON 資料（如 weather, spring, rain）。

請直接提供完整可執行的 HTML 代碼。

```

**新增重點說明：**

* **短句挖空填充**：增加聽句子填空測驗模組，點擊播音後填寫目標單字。
* **語意色塊區分**：主詞以藍色（`bg-blue-100`）、動詞以紅色（`bg-rose-100`）高亮顯示。
* **慢速朗讀控制**：句子降至 `0.65x`、音節降至 `0.5x`，方便特教學生的聽力吸收。
